<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Input Nilai Dosen - STAIIS</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8">

  <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-xl overflow-hidden">
    <!-- Header -->
    <div class="bg-emerald-700 p-6 text-white text-center">
      <h1 class="text-2xl font-bold">Portal Input Nilai Dosen</h1>
      <p class="text-sm opacity-90 mt-1">Pilih Dosen & Mata Kuliah untuk Mengisi Nilai Mahasiswa</p>
    </div>

    <div class="p-6 md:p-8 space-y-6">
      
      <!-- Step 1: Pilih Dosen -->
      <div class="bg-slate-50 p-4 rounded-xl border">
        <label class="block text-sm font-bold text-slate-700 mb-2">1. Pilih Nama Dosen Pengampu</label>
        <select id="selectDosen" class="w-full px-4 py-2.5 border rounded-lg bg-white focus:ring-2 focus:ring-emerald-500 font-medium">
          <option value="">-- Memuat Data Dosen... --</option>
        </select>
      </div>

      <!-- Step 2: Kartu Mata Kuliah -->
      <div id="sectionCourses" class="hidden space-y-3">
        <label class="block text-sm font-bold text-slate-700">2. Pilih Mata Kuliah (Klik Kartu)</label>
        <div id="courseCardsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- Kartu MK akan muncul di sini secara dinamis -->
        </div>
      </div>

      <!-- Step 3: Tabel Input Nilai Mahasiswa -->
      <div id="sectionInputNilai" class="hidden space-y-4 border-t pt-6">
        <div class="bg-emerald-50 border border-emerald-200 p-4 rounded-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-2">
          <div>
            <h2 id="activeCourseTitle" class="text-lg font-bold text-emerald-900"></h2>
            <p id="activeCourseMeta" class="text-xs text-emerald-700 mt-0.5"></p>
          </div>
          <button type="button" onclick="resetSelection()" class="text-xs bg-white border border-emerald-300 text-emerald-700 px-3 py-1.5 rounded-lg hover:bg-emerald-100 font-semibold">
            ← Ganti Mata Kuliah
          </button>
        </div>

        <form id="formBatchNilai">
          <div class="overflow-x-auto border rounded-xl">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="bg-slate-200 text-slate-700 text-xs uppercase tracking-wider">
                  <th class="p-3 text-center w-12">No</th>
                  <th class="p-3">Nama Mahasiswa</th>
                  <th class="p-3 text-center w-28">Keaktifan (15)</th>
                  <th class="p-3 text-center w-28">Tugas (35)</th>
                  <th class="p-3 text-center w-28">UTS (15)</th>
                  <th class="p-3 text-center w-28">UAS (35)</th>
                  <th class="p-3 text-center w-28">Nilai Akhir</th>
                </tr>
              </thead>
              <tbody id="studentTableBody" class="divide-y text-sm">
                <!-- Daftar mahasiswa terisi otomatis -->
              </tbody>
            </table>
          </div>

          <div class="mt-6">
            <button type="submit" id="btnSubmitAll" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl shadow-lg transition duration-200">
              Simpan Semua Nilai ke Database Nilai
            </button>
          </div>
        </form>
      </div>

      <div id="alertBox" class="hidden p-4 rounded-xl text-center text-sm font-semibold"></div>

    </div>
  </div>

  <script>
    // URL Web App Apps Script Anda sudah terpasang permanen di sini:
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzTozvvshKZGbj27fEg-LBb6FI2c1rWIXtl0qtoHhUO3jlOFblbtWiGSdt6hFZ8cN_t0g/exec";

    let appData = null;
    let selectedCourse = null;

    // Load data saat halaman dibuka
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        let res = await fetch(SCRIPT_URL);
        appData = await res.json();
        
        let selectDosen = document.getElementById('selectDosen');
        selectDosen.innerHTML = '<option value="">-- Pilih Nama Anda --</option>';
        
        appData.dosenList.forEach(dosen => {
          let opt = document.createElement('option');
          opt.value = dosen;
          opt.textContent = dosen;
          selectDosen.appendChild(opt);
        });
      } catch (err) {
        alert("Gagal memuat data dari Spreadsheet. Periksa koneksi atau pastikan Web App sudah di-deploy ulang dengan benar.");
      }
    });

    // Ketika Dosen dipilih -> Tampilkan Kartu Mata Kuliah
    document.getElementById('selectDosen').addEventListener('change', function() {
      let dosenName = this.value;
      let grid = document.getElementById('courseCardsGrid');
      let sectionCourses = document.getElementById('sectionCourses');
      document.getElementById('sectionInputNilai').classList.add('hidden');
      
      grid.innerHTML = '';
      if (!dosenName) {
        sectionCourses.classList.add('hidden');
        return;
      }

      let filteredCourses = appData.courses.filter(c => c.dosen === dosenName);
      
      if (filteredCourses.length === 0) {
        grid.innerHTML = '<p class="text-sm text-slate-500 col-span-2">Tidak ada mata kuliah ditemukan untuk dosen ini.</p>';
      } else {
        filteredCourses.forEach(c => {
          let card = document.createElement('div');
          card.className = "bg-white border-2 border-slate-200 hover:border-emerald-500 p-4 rounded-xl shadow-sm cursor-pointer transition hover:shadow-md flex flex-col justify-between";
          card.innerHTML = `
            <div>
              <div class="flex justify-between items-start mb-2">
                <span class="text-xs font-bold bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded">${c.prodi}</span>
                <span class="text-xs text-slate-500 font-medium">SKS: ${c.sks} | Sem: ${c.semester}</span>
              </div>
              <h3 class="font-bold text-slate-800 text-base mb-1">${c.mataKuliah}</h3>
              <p class="text-xs text-slate-500">Kode MK: ${c.kodeMk}</p>
            </div>
            <div class="mt-4 pt-3 border-t flex justify-between items-center text-xs text-slate-600">
              <span>TA: ${c.ta}</span>
              <span class="font-semibold text-emerald-600 flex items-center gap-1">Input Nilai →</span>
            </div>
          `;
          card.onclick = () => selectCourse(c);
          grid.appendChild(card);
        });
      }
      sectionCourses.classList.remove('hidden');
    });

    // Ketika Kartu Mata Kuliah diklik -> Munculkan Tabel Mahasiswa Otomatis
    function selectCourse(course) {
      selectedCourse = course;
      document.getElementById('sectionCourses').classList.add('hidden');
      document.getElementById('selectDosen').closest('.bg-slate-50').classList.add('hidden');
      
      document.getElementById('activeCourseTitle').textContent = `${course.mataKuliah} (${course.prodi})`;
      document.getElementById('activeCourseMeta').textContent = `Dosen: ${course.dosen} | TA: ${course.ta} | Semester: ${course.semester}`;
      
      let studentList = course.prodi.toLowerCase().includes('hki') ? appData.studentsHKI : appData.studentsPBA;
      let tbody = document.getElementById('studentTableBody');
      tbody.innerHTML = '';

      if (studentList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="p-4 text-center text-slate-500">Tidak ada daftar mahasiswa ditemukan untuk prodi ${course.prodi}. Pastikan sheet Nilai HKI / Nilai PBA terisi.</td></tr>`;
      } else {
        studentList.forEach((namaMhs, idx) => {
          let tr = document.createElement('tr');
          tr.className = "hover:bg-slate-50 transition";
          tr.innerHTML = `
            <td class="p-3 text-center text-slate-500 font-medium">${idx + 1}</td>
            <td class="p-3 font-semibold text-slate-800 student-name">${namaMhs}</td>
            <td class="p-2"><input type="number" step="0.1" min="0" max="15" class="input-grade input-keaktifan w-full p-2 border rounded text-center focus:ring-2 focus:ring-emerald-500" placeholder="0-15" oninput="calculateTotal(this)"></td>
            <td class="p-2"><input type="number" step="0.1" min="0" max="35" class="input-grade input-tugas w-full p-2 border rounded text-center focus:ring-2 focus:ring-emerald-500" placeholder="0-35" oninput="calculateTotal(this)"></td>
            <td class="p-2"><input type="number" step="0.1" min="0" max="15" class="input-grade input-uts w-full p-2 border rounded text-center focus:ring-2 focus:ring-emerald-500" placeholder="0-15" oninput="calculateTotal(this)"></td>
            <td class="p-2"><input type="number" step="0.1" min="0" max="35" class="input-grade input-uas w-full p-2 border rounded text-center focus:ring-2 focus:ring-emerald-500" placeholder="0-35" oninput="calculateTotal(this)"></td>
            <td class="p-3 text-center font-bold text-emerald-700 total-score">0.0</td>
          `;
          tbody.appendChild(tr);
        });
      }

      document.getElementById('sectionInputNilai').classList.remove('hidden');
    }

    // Hitung otomatis Nilai Akhir per baris saat diketik
    function calculateTotal(input) {
      let row = input.closest('tr');
      let keaktifan = parseFloat(row.querySelector('.input-keaktifan').value) || 0;
      let tugas = parseFloat(row.querySelector('.input-tugas').value) || 0;
      let uts = parseFloat(row.querySelector('.input-uts').value) || 0;
      let uas = parseFloat(row.querySelector('.input-uas').value) || 0;
      
      let total = keaktifan + tugas + uts + uas;
      row.querySelector('.total-score').textContent = total.toFixed(1);
    }

    function resetSelection() {
      document.getElementById('sectionInputNilai').classList.add('hidden');
      document.getElementById('sectionCourses').classList.remove('hidden');
      document.getElementById('selectDosen').closest('.bg-slate-50').classList.remove('hidden');
    }

    // Kirim data nilai massal ke Spreadsheet (Database Nilai)
    document.getElementById('formBatchNilai').addEventListener('submit', async function(e) {
      e.preventDefault();
      let btn = document.getElementById('btnSubmitAll');
      let alertBox = document.getElementById('alertBox');
      
      btn.disabled = true;
      btn.textContent = 'Menyimpan ke Database...';
      alertBox.classList.add('hidden');

      let rows = document.querySelectorAll('#studentTableBody tr');
      let gradesData = [];

      rows.forEach(row => {
        let nama = row.querySelector('.student-name').textContent;
        let keaktifan = row.querySelector('.input-keaktifan').value;
        let tugas = row.querySelector('.input-tugas').value;
        let uts = row.querySelector('.input-uts').value;
        let uas = row.querySelector('.input-uas').value;

        gradesData.push({ nama, keaktifan, tugas, uts, uas });
      });

      let payload = {
        dosen: selectedCourse.dosen,
        kodeMk: selectedCourse.kodeMk,
        mataKuliah: selectedCourse.mataKuliah,
        prodi: selectedCourse.prodi,
        ta: selectedCourse.ta,
        semester: selectedCourse.semester,
        grades: gradesData
      };

      try {
        let res = await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        alertBox.className = "p-4 rounded-xl text-center text-sm font-semibold bg-emerald-100 text-emerald-800 border border-emerald-300";
        alertBox.textContent = "Berhasil! Semua nilai mahasiswa telah tersimpan ke tab 'Database Nilai'.";
        alertBox.classList.remove('hidden');
      } catch (err) {
        alertBox.className = "p-4 rounded-xl text-center text-sm font-semibold bg-red-100 text-red-800 border border-red-300";
        alertBox.textContent = "Gagal menyimpan data. Periksa koneksi internet Anda.";
        alertBox.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Simpan Semua Nilai ke Database Nilai';
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Input Nilai - Prodi PBA & HKI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen py-8 px-4">

  <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-md overflow-hidden">
    <!-- Header App -->
    <div class="bg-emerald-800 p-6 text-white text-center">
      <h1 class="text-2xl font-bold">PORTAL INPUT NILAI MAHASISWA</h1>
      <p class="text-emerald-100 text-sm mt-1">Program Studi PBA & HKI</p>
    </div>

    <form id="formNilai" class="p-6 space-y-5">
      
      <!-- Filter Konfigurasi Akademik -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 bg-emerald-50 p-4 rounded-lg border border-emerald-100">
        <div>
          <label class="block text-xs font-bold text-emerald-900 mb-1">Program Studi</label>
          <select id="prodi" onchange="updateMahasiswaList()" required class="w-full px-3 py-2 border rounded-md text-sm bg-white focus:ring-2 focus:ring-emerald-600">
            <option value="PBA">PBA (Pendidikan Bahasa Arab)</option>
            <option value="HKI">HKI (Hukum Keluarga Islam)</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-emerald-900 mb-1">Tahun Ajaran</label>
          <select id="tahunAjaran" required class="w-full px-3 py-2 border rounded-md text-sm bg-white focus:ring-2 focus:ring-emerald-600">
            <option value="2023-2024">2023 / 2024</option>
            <option value="2024-2025" selected>2024 / 2025</option>
            <option value="2025-2026">2025 / 2026</option>
            <option value="2026-2027">2026 / 2027</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-emerald-900 mb-1">Semester</label>
          <select id="semester" required class="w-full px-3 py-2 border rounded-md text-sm bg-white focus:ring-2 focus:ring-emerald-600">
            <option value="Ganjil">Ganjil</option>
            <option value="Genap">Genap</option>
          </select>
        </div>
      </div>

      <!-- Pilih Dosen -->
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">Dosen Pengampu</label>
        <select id="dosen" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-600">
          <option value="">-- Pilih Dosen Pengampu --</option>
          <option value="Ahmad Kholiludin, S.H.I., M.H.">Ahmad Kholiludin, S.H.I., M.H.</option>
          <option value="Dosen Pengampu 2">Dosen Pengampu 2</option>
          <option value="Dosen Pengampu 3">Dosen Pengampu 3</option>
        </select>
      </div>

      <!-- Pilih Mahasiswa (Dinamis Berdasarkan Prodi) -->
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">Nama Mahasiswa</label>
        <select id="nama" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-600">
          <!-- Otomatis terisi lewat JS -->
        </select>
      </div>

      <!-- Input Nilai Komponen -->
      <div class="grid grid-cols-2 gap-4 pt-2 border-t">
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Keaktifan (Maks 15)</label>
          <input type="number" step="0.1" max="15" min="0" id="keaktifan" required placeholder="0 - 15"
            class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-600">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Tugas (Maks 35)</label>
          <input type="number" step="0.1" max="35" min="0" id="tugas" required placeholder="0 - 35"
            class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-600">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">UTS (Maks 15)</label>
          <input type="number" step="0.1" max="15" min="0" id="uts" required placeholder="0 - 15"
            class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-600">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">UAS (Maks 35)</label>
          <input type="number" step="0.1" max="35" min="0" id="uas" required placeholder="0 - 35"
            class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-600">
        </div>
      </div>

      <button type="submit" id="btnSubmit"
        class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-3 rounded-lg transition duration-200 shadow-md">
        Simpan Nilai ke Spreadsheet
      </button>
    </form>

    <div id="alertBox" class="mx-6 mb-6 hidden p-3 rounded-lg text-center text-sm font-medium"></div>
  </div>

  <script>
    // MASUKKAN URL GOOGLE APPS SCRIPT ANDA DI SINI
    const SCRIPT_URL = "GANTI_DENGAN_URL_GOOGLE_APPS_SCRIPT_ANDA";

    // Data Mahasiswa berdasarkan Spreadsheet yang Anda lampirkan
    const dataMahasiswa = {
      PBA: [
        "Abdul Mutholib", "Ach. Faisal Ansori", "Ahmad Fajar Hidayat", 
        "Ahmad Liwaus Shiddiqi", "Deta Aria Ramadhani", "Faidz Zuhair Taqy", 
        "Goten Adzanni Sulung Aa Syahputra", "Irkham Malik Fauzan", "M. Taufiqunnaja", 
        "Muhammad Haidar Addaenuri", "Muhammad Rifan Zikran", "Reza Aditya Pratama", 
        "Varhan Safamarwah", "Wisnu Agustian Nursoleh", "Yanuar Purwa Karyana"
      ],
      HKI: [
        "Ahmad Ainun Naim", "Ahmad Zaki", "Alvin Raditya", "Bagas Setiawan",
        "Danang Prasetyo", "Faisal Reza", "Ilham Nur Huda", "Lukman Hakim",
        "M. Ridwan", "Naufal Hilmi", "Rahmat Hidayat", "Zuhdi Ali"
      ]
    };

    function updateMahasiswaList() {
      const prodi = document.getElementById('prodi').value;
      const selectMahasiswa = document.getElementById('nama');
      selectMahasiswa.innerHTML = '<option value="">-- Pilih Mahasiswa --</option>';

      if (dataMahasiswa[prodi]) {
        dataMahasiswa[prodi].forEach(mhs => {
          const opt = document.createElement('option');
          opt.value = mhs;
          opt.textContent = mhs;
          selectMahasiswa.appendChild(opt);
        });
      }
    }

    // Inisialisasi daftar mahasiswa pertama kali
    updateMahasiswaList();

    // Event Submit Form
    document.getElementById('formNilai').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      const alertBox = document.getElementById('alertBox');

      btn.disabled = true;
      btn.textContent = 'Menyimpan ke Spreadsheet...';
      alertBox.classList.add('hidden');

      const payload = {
        prodi: document.getElementById('prodi').value,
        tahunAjaran: document.getElementById('tahunAjaran').value,
        semester: document.getElementById('semester').value,
        dosen: document.getElementById('dosen').value,
        nama: document.getElementById('nama').value,
        keaktifan: document.getElementById('keaktifan').value,
        tugas: document.getElementById('tugas').value,
        uts: document.getElementById('uts').value,
        uas: document.getElementById('uas').value
      };

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        alertBox.className = "mx-6 mb-6 p-3 rounded-lg text-center text-sm font-medium bg-green-100 text-green-700 border border-green-300";
        alertBox.textContent = `Nilai ${payload.nama} berhasil tersimpan di sheet [${payload.prodi}_${payload.tahunAjaran}_${payload.semester}]!`;
        alertBox.classList.remove('hidden');

        // Reset nilai input (opsional tetap pertahankan prodi/dosen)
        document.getElementById('keaktifan').value = '';
        document.getElementById('tugas').value = '';
        document.getElementById('uts').value = '';
        document.getElementById('uas').value = '';
      } catch (err) {
        alertBox.className = "mx-6 mb-6 p-3 rounded-lg text-center text-sm font-medium bg-red-100 text-red-700 border border-red-300";
        alertBox.textContent = "Gagal mengirim data! Periksa koneksi internet.";
        alertBox.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Simpan Nilai ke Spreadsheet';
      }
    });
  </script>
</body>
</html>

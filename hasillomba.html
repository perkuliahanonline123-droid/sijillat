<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#8b1515">
    <title>Pengumuman Hasil Lomba</title>
    <!-- Import Font Premium: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { 
            box-sizing: border-box; 
        }
        body { 
            font-family: 'Poppins', sans-serif; 
            background-color: #f0f2f5; 
            margin: 0; 
            padding: 0; 
            color: #2c3e50;
        }

        /* HEADER PREMIUM */
        .header-bg {
            background: linear-gradient(135deg, #8b1515 0%, #a91d1d 50%, #d32f2f 100%);
            padding: 60px 20px 120px 20px;
            color: white;
            text-align: center;
            border-bottom-left-radius: 40px;
            border-bottom-right-radius: 40px;
            box-shadow: 0 10px 30px rgba(139, 21, 21, 0.3);
            position: relative;
        }
        .header-bg h1 {
            margin: 0;
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-shadow: 2px 4px 8px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }
        .header-bg p {
            margin-top: 10px;
            font-size: 15px;
            opacity: 0.9;
            font-weight: 400;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.2);
        }

        /* CONTAINER CARD */
        .container { 
            max-width: 1400px; 
            width: 96%; 
            margin: -70px auto 50px auto; 
            background: #ffffff; 
            padding: 30px 40px; 
            border-radius: 24px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.08), 0 5px 15px rgba(0,0,0,0.03); 
            position: relative;
            z-index: 10;
        }

        /* KONTROL PENCARIAN & CETAK */
        .controls-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 15px;
            flex-wrap: wrap;
        }
        .search-container {
            flex: 1;
            position: relative;
            min-width: 250px;
            max-width: 400px;
        }
        .search-input {
            width: 100%;
            padding: 12px 20px 12px 45px;
            border: 2px solid #e0e6ed;
            border-radius: 30px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
            color: #2c3e50;
        }
        .search-input:focus {
            border-color: #8b1515;
            box-shadow: 0 0 0 3px rgba(139, 21, 21, 0.1);
        }
        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #95a5a6;
            font-size: 16px;
        }
        .btn-print {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            box-shadow: 0 4px 10px rgba(44, 62, 80, 0.2);
        }
        .btn-print:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(44, 62, 80, 0.3);
        }

        .table-responsive {
            overflow-x: auto; 
            padding-bottom: 20px;
        }

        /* TABEL MODERN */
        table { 
            width: 100%; 
            border-collapse: separate; 
            border-spacing: 0 12px;
            margin-top: 10px; 
            font-size: 14px; 
        }
        
        th { 
            padding: 12px 15px; 
            text-align: left; 
            color: #7f8c8d; 
            font-size: 12px; 
            text-transform: uppercase; 
            font-weight: 700;
            letter-spacing: 1px;
            border: none;
            white-space: nowrap; 
        }

        /* BARIS TABEL TIMBUL */
        tbody tr {
            background-color: #ffffff;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.04));
        }
        
        tbody tr:hover {
            transform: translateY(-4px) scale(1.005);
            filter: drop-shadow(0 12px 20px rgba(0,0,0,0.12));
            z-index: 5;
            position: relative;
        }

        td { 
            padding: 16px 15px; 
            vertical-align: middle;
            color: #34495e;
            font-weight: 500;
            border-top: 1px solid #f1f2f6;
            border-bottom: 1px solid #f1f2f6;
        }
        
        td:first-child {
            border-left: 1px solid #f1f2f6;
            border-top-left-radius: 16px;
            border-bottom-left-radius: 16px;
            white-space: nowrap;
        }
        td:last-child {
            border-right: 1px solid #f1f2f6;
            border-top-right-radius: 16px;
            border-bottom-right-radius: 16px;
        }

        /* BADGE PERINGKAT (1 Baris) */
        .badge-peringkat {
            font-weight: 700;
            padding: 8px 16px;
            border-radius: 30px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            text-align: center;
            white-space: nowrap;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            letter-spacing: 0.5px;
        }
        .juara-1 { background: linear-gradient(135deg, #F9D423 0%, #FF4E50 100%); color: white; text-shadow: 0px 1px 2px rgba(0,0,0,0.2); }
        .juara-2 { background: linear-gradient(135deg, #e0e0e0 0%, #9e9e9e 100%); color: white; text-shadow: 0px 1px 2px rgba(0,0,0,0.2); }
        .juara-3 { background: linear-gradient(135deg, #f6d365 0%, #fda085 100%); color: white; text-shadow: 0px 1px 2px rgba(0,0,0,0.2); }
        .terbaik { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); color: white; text-shadow: 0px 1px 2px rgba(0,0,0,0.2); }
        .biasa { background: #f8f9fa; color: #7f8c8d; border: 1px solid #dfe6e9; box-shadow: none; }

        /* TEKS SKOR */
        .skor-text { font-size: 18px; color: #a91d1d; font-weight: 800; }

        /* BADGE TERLAMBAT */
        .telat { 
            color: #e74c3c; font-weight: 600; font-size: 11px; background: #fadbd8;
            padding: 4px 10px; border-radius: 12px; display: inline-block;
            margin-top: 6px; box-shadow: 0 2px 5px rgba(231, 76, 60, 0.2);
        }

        /* ANIMASI LOADING */
        .loading-container { text-align: center; padding: 50px 20px; color: #7f8c8d; }
        .spinner {
            width: 44px; height: 44px; border: 4px solid #f1f2f6;
            border-top: 4px solid #8b1515; border-radius: 50%;
            margin: 0 auto 16px auto; animation: spin 0.9s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-text { font-size: 15px; font-weight: 500; color: #7f8c8d; letter-spacing: 0.3px; }

        /* PESAN TIDAK DITEMUKAN */
        .no-data-msg { text-align: center; padding: 30px; font-weight: 600; color: #e74c3c; display: none; }

        /* RESPONSIVE LAYOUT HP */
        @media (max-width: 992px) {
            .container { padding: 20px 20px; width: 98%; }
        }
        @media (max-width: 768px) {
            .container { padding: 20px 15px; margin-top: -50px; border-radius: 20px;}
            .header-bg { padding: 40px 15px 90px 15px; border-bottom-left-radius: 25px; border-bottom-right-radius: 25px;}
            .header-bg h1 { font-size: 22px; }
            th, td { padding: 12px 10px; font-size: 13px; }
            .badge-peringkat { padding: 6px 12px; font-size: 11px; }
            .skor-text { font-size: 16px; }
            .controls-wrapper { flex-direction: column; align-items: stretch; }
            .search-container { max-width: none; }
        }

        /* =========================================================
           ATURAN CETAK PDF (NATIVE PRINT BROWSER)
           ========================================================= */
        @media print {
            body { background-color: #ffffff; }
            
            /* Sederhanakan Header agar hemat tinta & rapi di PDF */
            .header-bg { 
                background: white !important; 
                padding: 10px 0 20px 0 !important; 
                border-radius: 0 !important; 
                box-shadow: none !important;
                border-bottom: 3px solid #8b1515;
            }
            .header-bg h1 { color: #8b1515 !important; text-shadow: none !important; font-size: 24px; }
            .header-bg p { color: #333 !important; text-shadow: none !important; }

            /* Sembunyikan elemen yang tidak perlu dicetak */
            .controls-wrapper, .loader { display: none !important; }

            /* Normalisasi Container & Tabel */
            .container { 
                box-shadow: none !important; 
                margin: 0 !important; 
                padding: 20px 0 !important; 
                width: 100% !important; 
                max-width: none !important; 
            }
            .table-responsive { overflow-x: visible !important; }
            
            /* Buat tabel menjadi format garis standar agar jelas di kertas */
            table { border-collapse: collapse !important; border-spacing: 0 !important; margin-top: 0 !important; }
            th, td { 
                padding: 8px 10px !important; 
                font-size: 11px !important; 
                border: 1px solid #bdc3c7 !important; 
                border-radius: 0 !important; 
            }
            th { background-color: #f1f2f6 !important; color: #2c3e50 !important; }
            tbody tr { filter: none !important; transform: none !important; box-shadow: none !important; }
            
            /* Memaksa browser mencetak warna background pada badge/label */
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            
            /* Pengaturan margin kertas A4 Landscape/Portrait */
            @page { margin: 1cm; size: landscape; }
        }
    </style>
</head>
<body>

<div class="header-bg">
    <h1 id="judulLomba">PENGUMUMAN HASIL LOMBA</h1>
    <p>Daftar urutan juara berdasarkan skor tertinggi dan waktu penyelesaian tercepat</p>
</div>

<div class="container">
    <div id="loading" class="loading-container">
        <div class="spinner"></div>
        <div class="loading-text">Memuat data peringkat...</div>
    </div>

    <!-- WRAPPER UNTUK KONTEN UTAMA (Sembunyi saat loading) -->
    <div id="mainContent" style="display: none;">
        
        <!-- KONTROL PENCARIAN & CETAK PDF -->
        <div class="controls-wrapper">
            <div class="search-container">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" class="search-input" placeholder="Cari nama peserta..." onkeyup="cariNama()">
            </div>
            <button class="btn-print" onclick="window.print()">
                🖨️ Cetak PDF
            </button>
        </div>

        <div id="noDataMsg" class="no-data-msg">Nama peserta tidak ditemukan.</div>

        <div class="table-responsive">
            <table id="tabelLomba">
                <thead>
                    <tr>
                        <th>Peringkat</th>
                        <th>Nama Lengkap</th>
                        <th>Asal Kota/Lembaga</th>
                        <th>Skor</th>
                        <th>Predikat</th>
                        <th>Waktu Submit</th>
                        <th>Durasi Pengerjaan</th>
                    </tr>
                </thead>
                <tbody id="tabelBody">
                    <!-- Data dimasukkan via Javascript -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // URL WEB APP DARI GOOGLE APPS SCRIPT
    const API_URL = 'https://script.google.com/macros/s/AKfycbwxvPBwhsDyf6mTpK3pXa_NBqOwO1YlwHLXVkamwPHLN5xSiEL1cyQtaEGj8V66LmzNmw/exec';

    async function fetchDataLomba() {
        try {
            const response = await fetch(API_URL);
            const result = await response.json();
            
            if (result.status === "success") {
                
                // Mengubah judul menyesuaikan Google Sheets
                const judulEl = document.getElementById("judulLomba");
                if (result.nama_lomba) {
                    judulEl.innerText = result.nama_lomba;
                    document.title = result.nama_lomba; 
                } else {
                    judulEl.innerText = "Peringkat & Hasil Lomba";
                }

                const data = result.data;
                const tbody = document.getElementById("tabelBody");
                let html = "";
                
                data.forEach(p => {
                    let badgeTelat = p.status === "Terlambat" ? `<br><span class="telat">Terlambat</span>` : "";
                    
                    let namaKapital = p.nama_lengkap ? p.nama_lengkap.toUpperCase() : "-";
                    let asalKapital = p.asal ? p.asal.toUpperCase() : "-";
                    
                    let peringkat = parseInt(p.peringkat);
                    let teksPeringkat = "";
                    let kelasPeringkat = "biasa";
                    
                    if (peringkat === 1) {
                        teksPeringkat = "🏆 JUARA 1";
                        kelasPeringkat = "juara-1";
                    } else if (peringkat === 2) {
                        teksPeringkat = "🥈 JUARA 2";
                        kelasPeringkat = "juara-2";
                    } else if (peringkat === 3) {
                        teksPeringkat = "🥉 JUARA 3";
                        kelasPeringkat = "juara-3";
                    } else if (peringkat >= 4 && peringkat <= 10) {
                        teksPeringkat = "⭐ TERBAIK " + peringkat;
                        kelasPeringkat = "terbaik";
                    } else {
                        teksPeringkat = "PERINGKAT " + peringkat;
                    }
                    
                    html += `
                        <tr class="data-row">
                            <td><span class="badge-peringkat ${kelasPeringkat}">${teksPeringkat}</span></td>
                            <td class="nama-kolom"><strong>${namaKapital}</strong></td>
                            <td>${asalKapital}</td>
                            <td class="skor-text">${p.skor}</td>
                            <td><strong>${p.predikat}</strong></td>
                            <td>${p.waktu_submit}</td>
                            <td>${p.durasi_pengerjaan} ${badgeTelat}</td>
                        </tr>
                    `;
                });
                
                tbody.innerHTML = html;
                
                // Hilangkan Loading, Tampilkan Konten
                document.getElementById("loading").style.display = "none";
                document.getElementById("mainContent").style.display = "block";
            }
        } catch (error) {
            document.getElementById("loading").innerHTML = '<div class="loading-text" style="color: #e74c3c;">Gagal memuat data. Silakan refresh halaman.</div>';
            console.error("Error fetching data:", error);
        }
    }

    // FUNGSI PENCARIAN NAMA PESERTA
    function cariNama() {
        const input = document.getElementById("searchInput");
        const filter = input.value.toUpperCase();
        const table = document.getElementById("tabelLomba");
        const tr = table.getElementsByClassName("data-row");
        let dataFound = false;

        // Looping semua baris data
        for (let i = 0; i < tr.length; i++) {
            // Ambil teks dari kolom ke-2 (Nama Lengkap)
            let td = tr[i].getElementsByClassName("nama-kolom")[0]; 
            if (td) {
                let txtValue = td.textContent || td.innerText;
                if (txtValue.toUpperCase().indexOf(filter) > -1) {
                    tr[i].style.display = ""; // Tampilkan jika cocok
                    dataFound = true;
                } else {
                    tr[i].style.display = "none"; // Sembunyikan jika tidak cocok
                }
            }       
        }

        // Tampilkan pesan jika nama tidak ditemukan
        const noDataMsg = document.getElementById("noDataMsg");
        if (!dataFound) {
            noDataMsg.style.display = "block";
            table.style.display = "none";
        } else {
            noDataMsg.style.display = "none";
            table.style.display = "table";
        }
    }

    window.onload = fetchDataLomba;
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#8b1515">
    <title>Pengumuman Hasil Lomba</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f4f7f6; 
            margin: 0; 
            padding: 0; 
            color: #333;
        }

        .header-bg {
            background: linear-gradient(135deg, #7b1313, #a91d1d);
            padding: 50px 20px 100px 20px;
            color: white;
            text-align: center;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
        }
        .header-bg h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }
        .header-bg p {
            margin-top: 8px;
            font-size: 14px;
            opacity: 0.9;
            font-weight: 300;
        }

        .container { 
            max-width: 1050px; 
            margin: -60px auto 40px auto; 
            background: #fff; 
            padding: 25px; 
            border-radius: 16px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.08); 
            width: 95%;
        }

        .table-responsive {
            overflow-x: auto;
        }

        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 10px; 
            font-size: 14px; 
        }
        th { 
            padding: 16px 12px; 
            text-align: left; 
            border-bottom: 2px solid #eaeaea; 
            color: #555; 
            font-size: 12px; 
            text-transform: uppercase; 
            font-weight: 700;
            background-color: #fff;
        }
        td { 
            padding: 16px 12px; 
            border-bottom: 1px solid #f2f2f2; 
            vertical-align: middle;
            color: #444;
            font-weight: 500;
        }
        tr:hover { background-color: #f9fbfd; }

        .badge-peringkat {
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 20px;
            display: inline-block;
            font-size: 12px;
            text-align: center;
            min-width: 100px;
        }
        .juara-1 { background: #ffeb3b; color: #b78a00; border: 1px solid #fde073; }
        .juara-2 { background: #e0e0e0; color: #616161; border: 1px solid #ccc; }
        .juara-3 { background: #f5cdb6; color: #a65b34; border: 1px solid #e2b49a; }
        .terbaik { background: #e8f5e9; color: #2e7d32; }
        .biasa { background: #f1f3f5; color: #495057; }

        .telat { 
            color: #d32f2f; 
            font-weight: 600; 
            font-size: 11px;
            background: #ffebee;
            padding: 3px 8px;
            border-radius: 12px;
            display: inline-block;
            margin-top: 6px;
        }

        .loading { text-align: center; font-size: 16px; color: #666; margin: 40px 0; }

        @media (max-width: 768px) {
            .container { padding: 15px; margin-top: -40px; }
            .header-bg { padding: 40px 15px 80px 15px; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px;}
            .header-bg h1 { font-size: 22px; }
            th, td { padding: 12px 8px; font-size: 13px; }
            .badge-peringkat { padding: 4px 8px; font-size: 11px; min-width: 80px;}
        }
    </style>
</head>
<body>

<div class="header-bg">
    <!-- Tambahkan id="judulLomba" agar bisa diubah via Javascript -->
    <h1 id="judulLomba">Memuat Nama Lomba...</h1>
    <p>Daftar urutan juara berdasarkan skor tertinggi dan waktu penyelesaian tercepat</p>
</div>

<div class="container">
    <div id="loading" class="loading">Memuat data peserta...</div>
    <div class="table-responsive">
        <table id="tabelLomba" style="display:none;">
            <thead>
                <tr>
                    <th>Peringkat</th>
                    <th>Nama Lengkap</th>
                    <th>Asal Kota/Lembaga</th>
                    <th>Skor</th>
                    <th>Predikat</th>
                    <th>Waktu Submit</th>
                    <th>Durasi Pengerjaan</th>
                </tr>
            </thead>
            <tbody id="tabelBody">
            </tbody>
        </table>
    </div>
</div>

<script>
    // URL WEB APP DARI GOOGLE APPS SCRIPT
    const API_URL = 'https://script.google.com/macros/s/AKfycbwxvPBwhsDyf6mTpK3pXa_NBqOwO1YlwHLXVkamwPHLN5xSiEL1cyQtaEGj8V66LmzNmw/exec';

    async function fetchDataLomba() {
        try {
            const response = await fetch(API_URL);
            const result = await response.json();
            
            if (result.status === "success") {
                
                // MENGUBAH JUDUL LOMBA DARI GOOGLE SHEETS
                const judulEl = document.getElementById("judulLomba");
                if (result.nama_lomba) {
                    judulEl.innerText = result.nama_lomba;
                    document.title = result.nama_lomba; // Update title browser juga
                } else {
                    judulEl.innerText = "Peringkat & Hasil Lomba";
                }

                const data = result.data;
                const tbody = document.getElementById("tabelBody");
                let html = "";
                
                data.forEach(p => {
                    let badgeTelat = p.status === "Terlambat" ? `<br><span class="telat">Terlambat</span>` : "";
                    
                    let namaKapital = p.nama_lengkap ? p.nama_lengkap.toUpperCase() : "-";
                    let asalKapital = p.asal ? p.asal.toUpperCase() : "-";
                    
                    let peringkat = parseInt(p.peringkat);
                    let teksPeringkat = "";
                    let kelasPeringkat = "biasa";
                    
                    if (peringkat === 1) {
                        teksPeringkat = "🏆 JUARA 1";
                        kelasPeringkat = "juara-1";
                    } else if (peringkat === 2) {
                        teksPeringkat = "🥈 JUARA 2";
                        kelasPeringkat = "juara-2";
                    } else if (peringkat === 3) {
                        teksPeringkat = "🥉 JUARA 3";
                        kelasPeringkat = "juara-3";
                    } else if (peringkat >= 4 && peringkat <= 10) {
                        teksPeringkat = "⭐ TERBAIK " + peringkat;
                        kelasPeringkat = "terbaik";
                    } else {
                        teksPeringkat = "PERINGKAT " + peringkat;
                    }
                    
                    html += `
                        <tr>
                            <td><span class="badge-peringkat ${kelasPeringkat}">${teksPeringkat}</span></td>
                            <td><strong>${namaKapital}</strong></td>
                            <td>${asalKapital}</td>
                            <td style="font-size: 16px;"><strong>${p.skor}</strong></td>
                            <td>${p.predikat}</td>
                            <td>${p.waktu_submit}</td>
                            <td>${p.durasi_pengerjaan} ${badgeTelat}</td>
                        </tr>
                    `;
                });
                
                tbody.innerHTML = html;
                document.getElementById("loading").style.display = "none";
                document.getElementById("tabelLomba").style.display = "table";
            }
        } catch (error) {
            document.getElementById("loading").innerHTML = "Gagal memuat data. Silakan refresh halaman.";
            console.error("Error fetching data:", error);
        }
    }

    window.onload = fetchDataLomba;
</script>

</body>
</html>
